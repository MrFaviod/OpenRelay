[package]
name = "openrelay-bridge"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false
description = "Puente JNI de test: identidad mTLS de cliente desde AndroidKeyStore "

# Crate FUERA del workspace raíz: lleva su propio Cargo.lock.
[workspace]

[lib]
name = "openrelay_bridge"
crate-type = ["cdylib"]

[dependencies]
openrelay-audio-core = { path = "../../crates/audio-core" }
openrelay-codec = { path = "../../crates/codec" }
openrelay-proto = { path = "../../crates/proto" }
openrelay-transport = { path = "../../crates/transport" }
jni = { version = "=0.21.1", default-features = false }
rcgen = { version = "=0.13.1", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.22", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "=1.16.0"
ring = { version = "=0.17.8", default-features = false, features = ["alloc", "std"] }

[features]
# Se enciende cuando crates/transport expone EnrollOutcome; build.sh lo detecta.
enroll-outcome = []
