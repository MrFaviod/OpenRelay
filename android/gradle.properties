# Propiedades Gradle del proyecto Android.
# AGP exige declarar AndroidX cuando hay dependencias androidx.* (Compose las
# usa todas). Sin esta propiedad `:app:checkDebugAarMetadata` falla, así que el
# archivo es requisito del build base de T12 y no un ajuste opcional.
android.useAndroidX=true
# No hay dependencias legacy que migrar; Jetifier queda apagado.
android.enableJetifier=false
