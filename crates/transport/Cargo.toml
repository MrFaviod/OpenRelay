[package]
name = "openrelay-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Transporte QUIC, identidad mTLS y frontera de enrolamiento de openrelay (sin Tokio)"

[dependencies]
openrelay-audio-core = { path = "../audio-core" }
openrelay-proto = { path = "../proto" }
bytes = "=1.8.0"
quinn-proto = { version = "=0.11.12", default-features = false, features = ["rustls-ring"] }
ring = { version = "=0.17.8", default-features = false, features = ["alloc", "std"] }
rustls = { version = "=0.23.22", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "=1.16.0"
serde_json = { version = "=1.0.128", default-features = false, features = ["std"] }
x509-cert = { version = "=0.2.5", default-features = false, features = ["std"] }

[dev-dependencies]
rcgen = { version = "=0.13.1", default-features = false, features = ["crypto", "ring"] }
time = "=0.3.36"

[lints]
workspace = true
