# Política de dependencias de openrelay (cargo-deny, propuesta; no ejecutada en T05).
# El core de F1 no tiene dependencias externas: este archivo fija el criterio
# para cuando se incorporen candidatos del ledger.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# ring 0.17.8 no declara SPDX: código nuevo ISC y partes heredadas de
# OpenSSL/BoringSSL (licencia OpenSSL, libre y permisiva). Excepción sólo para
# ring. Falta un [[licenses.clarify]] con el hash real de su LICENSE cuando se
# ejecute cargo-deny (no instalado aún en estas máquinas).
[[licenses.exceptions]]
crate = "ring"
allow = ["ISC", "OpenSSL"]
